<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قطعات یدکی موتور سیکلت پالس</title>
  <meta name="theme-color" content="#0a0e17">
  
  <!-- ریدایرکت مستقیم به اپ -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbwCv6I6FYXxfNasBqNbfJAGkgi7i4ILGeTijxxnbkOz1fs3k9_XRKqXlUOZ96bWD2Rf/exec">
  
  <script>
    // ریدایرکت فوری با جاوااسکریپت
    window.location.href = "https://script.google.com/macros/s/AKfycbwCv6I6FYXxfNasBqNbfJAGkgi7i4ILGeTijxxnbkOz1fs3k9_XRKqXlUOZ96bWD2Rf/exec";
  </script>
  
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0e17;
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      color: #f1f5f9;
    }
    
    .loading {
      text-align: center;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    .loading-icon {
      font-size: 50px;
      margin-bottom: 20px;
      display: block;
    }
    
    .loading-text {
      font-size: 14px;
      color: #94a3b8;
      display: block;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="loading">
    <span class="loading-icon">🏍</span>
    <span class="loading-text">در حال انتقال به برنامه...</span>
  </div>
</body>
</html>
